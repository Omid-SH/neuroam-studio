# Read the Docs configuration — https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: false

python:
  install:
    - requirements: docs/requirements.txt

# The source tree is added to Python's import path by docs/conf.py. Optional
# compiled integrations are mocked for API extraction and are not needed by
# the documentation build.
