# Read the Docs configuration — https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: false

python:
  install:
    - requirements: docs/requirements.txt

# The package itself (neuroam) is NOT installed here on purpose: autodoc
# only needs `neuroam` importable, which requires numpy/scipy/matplotlib
# (already in docs/requirements.txt) — not a `pip install -e .`, and
# definitely not NEURON, which has no wheel and would need a full compile
# step this build environment doesn't need to pay for.
